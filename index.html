<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Sistema Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Controle de Estoque Inteligente</h1>
                <p class="text-sm text-gray-500">Painel Operacional Sincronizado na Nuvem</p>
            </div>
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">Online (Supabase Ativo)</span>
        </header>

        <!-- Cards de Indicadores -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-sm font-medium text-gray-500">Total de Itens</p>
                <h3 id="totalItens" class="text-3xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-amber-500">
                <p class="text-sm font-medium text-gray-500">Valor em Estoque</p>
                <h3 id="valorTotal" class="text-3xl font-bold text-gray-800 mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-rose-500">
                <p class="text-sm font-medium text-gray-500">Alertas de Ruptura</p>
                <h3 id="totalAlertas" class="text-3xl font-bold text-rose-600 mt-1">0</h3>
            </div>
        </div>

        <!-- Formulário e Tabela -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Adicionar Produto</h2>
                <form id="formProduto" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Código (SKU)</label>
                        <input type="text" id="sku" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: PRD-001">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Nome do Material</label>
                        <input type="text" id="nome" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: Rolamento 6204">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Quantidade</label>
                            <input type="number" id="qtd" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Estoque Mínimo</label>
                            <input type="number" id="min" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Custo Unitário (R$)</label>
                        <input type="number" id="custo" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg text-sm hover:bg-blue-700 transition">Salvar no Sistema</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Inventário Atual</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase">
                                <th class="py-3 px-2">SKU / Produto</th>
                                <th class="py-3 px-2">Qtd</th>
                                <th class="py-3 px-2">Mín</th>
                                <th class="py-3 px-2">Custo</th>
                                <th class="py-3 px-2">Total</th>
                                <th class="py-3 px-2">Status</th>
                                <th class="py-3 px-2 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaEstoque" class="text-sm divide-y divide-gray-100">
                            <tr><td colspan="7" class="py-6 text-center text-gray-400">Carregando dados da nuvem...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Suas credenciais seguras do Supabase
        const SUPABASE_URL = 'https://vicftmaycxpdojolrql.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aaDp_kBwagtc5EqWTDmZIw_Me8DsPO0';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('formProduto');
        const tabela = document.getElementById('tabelaEstoque');
        const totalItensEl = document.getElementById('totalItens');
        const valorTotalEl = document.getElementById('valorTotal');
        const totalAlertasEl = document.getElementById('totalAlertas');

        async function carregarEstoque() {
            const { data: produtos, error } = await supabase.from('produtos').select('*');
            
            if (error) {
                console.error('Erro ao buscar:', error);
                tabela.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-rose-500 text-sm">Erro ao conectar à base de dados.</td></tr>`;
                return;
            }

            tabela.innerHTML = '';
            let totalQtd = 0;
            let valorAcumulado = 0;
            let alertas = 0;

            if (!produtos || produtos.length === 0) {
                tabela.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-gray-400 text-sm">Nenhum produto cadastrado no estoque.</td></tr>`;
            } else {
                produtos.forEach((p) => {
                    const totalItem = (p.qtd || 0) * (p.custo || 0);
                    totalQtd += parseInt(p.qtd || 0);
                    valorAcumulado += totalItem;

                    let statusBadge = '<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">Normal</span>';
                    if (parseInt(p.qtd || 0) <= parseInt(p.min || 0)) {
                        statusBadge = '<span class="bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-medium">Repor</span>';
                        alertas++;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-3 px-2">
                            <div class="font-medium text-gray-800">${p.nome || ''}</div>
                            <div class="text-xs text-gray-400">SKU: ${p.sku || ''}</div>
                        </td>
                        <td class="py-3 px-2 font-semibold text-gray-700">${p.qtd || 0}</td>
                        <td class="py-3 px-2 text-gray-500">${p.min || 0}</td>
                        <td class="py-3 px-2 text-gray-600">R$ ${parseFloat(p.custo || 0).toFixed(2)}</td>
                        <td class="py-3 px-2 text-gray-800 font-medium">R$ ${totalItem.toFixed(2)}</td>
                        <td class="py-3 px-2">${statusBadge}</td>
                        <td class="py-3 px-2 text-center">
                            <button onclick="removerProduto('${p.id}')" class="text-gray-400 hover:text-rose-600 text-xs font-semibold px-2 py-1">Excluir</button>
                        </td>
                    `;
                    tabela.appendChild(tr);
                });
            }

            totalItensEl.innerText = totalQtd;
            valorTotalEl.innerText = `R$ ${valorAcumulado.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            totalAlertasEl.innerText = alertas;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoProduto = {
                sku: document.getElementById('sku').value,
                nome: document.getElementById('nome').value,
                qtd: parseInt(document.getElementById('qtd').value),
                min: parseInt(document.getElementById('min').value),
                custo: parseFloat(document.getElementById('custo').value)
            };

            const { error } = await supabase.from('produtos').insert([novoProduto]);
            if (error) {
                alert('Erro ao salvar no Supabase. Verifique os campos.');
                console.error(error);
            } else {
                form.reset();
                carregarEstoque();
            }
        });

        async function removerProduto(id) {
            const { error } = await supabase.from('produtos').delete().eq('id', id);
            if (error) {
                alert('Erro ao excluir item.');
                console.error(error);
            } else {
                carregarEstoque();
            }
        }

        carregarEstoque();
    </script>
</body>
</html>
